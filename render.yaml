services:
  - type: web
    name: helios-expenses-mcp
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip && pip install .
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.8"
      # The workbook is committed to data/, so no external storage is needed.
      - key: HELIOS_XLSX
        value: ./data/Helios_Business_Travel_Expenses_2025.xlsx
